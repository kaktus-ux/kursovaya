<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #343a40; /* Темный фон */
            color: white; /* Белый текст */
        }
        .container {
            margin-top: 100px;
            max-width: 400px;
            background-color: #495057; /* Фон контейнера */
            padding: 20px;
            border-radius: 8px; /* Скругление углов */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Тень */
        }
        h1 {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
        }
        .btn-custom {
            background-color: white; /* Цвет кнопки */
            border: none; /* Убираем рамку */
            color: black; /* Белый текст на кнопке */
        }
        .btn-custom:hover {
            background-color: rgb(200, 200, 200); /* Темнее при наведении */
            color: black;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Тень при наведении */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вход</h1>
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Имя пользователя" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Войти</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
